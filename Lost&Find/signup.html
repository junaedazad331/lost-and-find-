
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Lost & Find</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-wrapper">

    <div class="auth-left">
        <div class="brand">Lost<span>&</span>Find</div>

        <div class="hero-content">
            <h1>Find What's Lost.<br>Return What's Found.</h1>
            <p>
                Join our community and help people
                reconnect with their lost belongings.
            </p>
        </div>

        <div class="auth-footer">
            Making lost things found again.
        </div>
    </div>

    <div class="auth-right">

        <div class="form-container">

            <h2>Create Account</h2>
            <p class="subtitle">Join our Lost & Find community</p>

            <form action="signup.php" method="POST">

                <label>Full Name</label>
                <input type="text" name="fullname"
                       placeholder="Enter your full name" required>

                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Create a password" minlength="8" required>

                <button type="submit">Create Account</button>

            </form>

            <p class="switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>
    </div>

</div>

</body>
</html>
